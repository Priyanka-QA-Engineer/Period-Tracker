}

/* ============================================================
   INSIGHTS
   ============================================================ */
function renderInsights(stats){
  if(stats.cycleCount===0){
    return `<div class="pt-card" style="text-align:center;padding:36px 22px;">
      <div style="font-size:34px;margin-bottom:10px;">🌸</div>
      <h3 style="font-size:17px;margin-bottom:6px;">No cycles yet</h3>
      <div style="font-size:13.5px;color:var(--pt-text-dim);line-height:1.6;max-width:300px;margin:0 auto;">Start logging your periods to understand your cycle patterns.</div>
    </div>`;
  }
  const insights = buildInsights(state.cycles, state.dailyLogs, stats);
  const symptomPattern = computeSymptomPattern(state.cycles, state.dailyLogs);
  const comparison = computeCycleComparison(state.cycles, state.dailyLogs);
  const monthlySummary = computeMonthlySummary(state.cycles, state.dailyLogs, new Date().getFullYear(), new Date().getMonth());

  return `
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="pt-card" style="background:var(--pt-gradient);border:1px solid rgba(255,255,255,0.5);">
        <div class="pt-eyebrow" style="margin-bottom:10px;">Your Pattern ✨</div>
        <div style="font-size:14.5px;line-height:1.6;">
          Your cycles have averaged <strong style="font-family:'Fraunces',serif;font-size:17px;">${stats.avgCycleLength} days</strong> over your last ${stats.cycleCount} cycle${stats.cycleCount===1?"":"s"}.
          ${stats.variation!=null ? (stats.variation<=3 ? " Your recent cycles are relatively consistent." : ` Your recent cycles have varied by ${stats.variation} days.`) : ""}
        </div>
      </div>

      ${renderMonthlyTeaser(monthlySummary)}
      ${renderCyclePatternCard(stats)}
      ${renderTimeline(stats)}
      ${symptomPattern.length>0 ? renderSymptomPatternCard(symptomPattern) : ""}
      ${comparison ? renderCompareCard(comparison) : ""}
      ${renderPeriodStoryCard(stats, symptomPattern)}

      <div>
        <div class="pt-eyebrow" style="margin-bottom:10px;">Smart Insights</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${insights.map(ins=>`<div class="pt-card" style="padding:14px;opacity:${ins.ready?1:0.65};"><div style="font-size:14px;line-height:1.5;">${esc(ins.text)}</div></div>`).join("")}
        </div>
      </div>

      ${renderPeriodDiary()}

      <div><div class="pt-eyebrow" style="margin-bottom:10px;">Cycle History</div>${renderCycleHistory()}</div>

      <div class="pt-card" style="background:var(--pt-surface-2);">
        <div style="font-size:11.5px;color:var(--pt-text-dim);line-height:1.6;">These insights describe patterns in what you've logged. They are informational only, not a medical diagnosis or a substitute for professional care.</div>
      </div>
    </div>`;
}

function renderMonthlyTeaser(summary){
  return `<button onclick="ui.monthlySummaryOpen=true; render();" class="pt-card pt-card-press" style="text-align:left;width:100%;display:block;border:none;">
    <div class="pt-eyebrow" style="margin-bottom:8px;">${summary.label} Cycle Summary 🌸</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px;">
      <div><div style="color:var(--pt-text-dim);">Period</div><div style="font-weight:600;margin-top:2px;">${summary.periodStart?`${fmtDate(summary.periodStart)}${summary.periodEnd?`–${fmtDate(summary.periodEnd)}`:""}`:"Not logged"}</div></div>
      <div><div style="color:var(--pt-text-dim);">Most logged symptom</div><div style="font-weight:600;margin-top:2px;">${summary.topSymptom||"—"}</div></div>
    </div>
    <div style="font-size:13px;color:var(--pt-primary);font-weight:600;margin-top:12px;">See your full monthly report →</div>
  </button>`;
}

function renderMonthlySummarySheet(summary){
  const delta = (curr,prev,unit="")=>{ if(curr==null||prev==null) return null; const d=Math.round((curr-prev)*10)/10; if(d===0) return "Same"; return `${d>0?"+":""}${d}${unit}`; };
  const rows = [
    {label:"Cycle", value: summary.cycleLength?`${summary.cycleLength} days`:"—", cmp: delta(summary.cycleLength, summary.prev.cycleLength," days")},
    {label:"Period duration", value: summary.periodLength?`${summary.periodLength} days`:"—", cmp: delta(summary.periodLength, summary.prev.periodLength," days")},
    {label:"Average pain", value: summary.avgPain!=null?`${summary.avgPain}/10`:"—", cmp: delta(summary.avgPain, summary.prev.avgPain)},
    {label:"Sleep", value: summary.avgSleep!=null?`${summary.avgSleep} hrs average`:"—", cmp: delta(summary.avgSleep, summary.prev.avgSleep," hrs")},
  ];
  const whatChanged=[];
  if(summary.cycleLength!=null && summary.prev.cycleLength!=null && summary.cycleLength!==summary.prev.cycleLength){
    const dd=summary.cycleLength-summary.prev.cycleLength;
    whatChanged.push(`Your cycle was ${Math.abs(dd)} day${Math.abs(dd)===1?"":"s"} ${dd>0?"longer":"shorter"} than last month.`);
  }
  if(summary.symptomDayCount!=null && summary.prev.symptomDayCount!=null && summary.symptomDayCount!==summary.prev.symptomDayCount){
    whatChanged.push(`You logged ${summary.symptomDayCount>summary.prev.symptomDayCount?"more":"fewer"} symptom days this month.`);
  }
  if(summary.avgSleep!=null && summary.prev.avgSleep!=null && Math.abs(summary.avgSleep-summary.prev.avgSleep)>=0.2){
    const dd=Math.round((summary.avgSleep-summary.prev.avgSleep)*10)/10;
    whatChanged.push(`Your average sleep ${dd>0?"increased":"decreased"} by ${Math.abs(dd)} hour${Math.abs(dd)===1?"":"s"}.`);
  }
  if(summary.avgPain!=null && summary.prev.avgPain!=null && summary.avgPain!==summary.prev.avgPain){
    const dd=Math.round((summary.avgPain-summary.prev.avgPain)*10)/10;
    whatChanged.push(`Your average pain was ${dd>0?"higher":"lower"} this month (${dd>0?"+":""}${dd}).`);
  }
  return `<div class="pt-sheet-backdrop" onclick="ui.monthlySummaryOpen=false; render();">
    <div class="pt-sheet" onclick="event.stopPropagation()">
      <div class="pt-grabber"></div>
      <h2 style="font-size:19px;margin-bottom:4px;">${summary.label} Summary 🌸</h2>
      <div style="font-size:12.5px;color:var(--pt-text-dim);margin-bottom:18px;">${summary.loggedDays} day${summary.loggedDays===1?"":"s"} logged this month</div>
      <div style="display:flex;flex-direction:column;">
        ${detailRow("Period", summary.periodStart?`${fmtDate(summary.periodStart)}${summary.periodEnd?` – ${fmtDate(summary.periodEnd)}`:""}`:"Not logged")}
        ${detailRow("Most logged symptom", summary.topSymptom||"—")}
        ${detailRow("Mood", summary.feeling||"—")}
        ${rows.map(r=>detailRow(r.label, r.value)).join("")}
      </div>
      ${whatChanged.length>0 ? `<div class="pt-card" style="margin-top:18px;background:var(--pt-gradient);border:1px solid rgba(255,255,255,0.5);">
        <div class="pt-eyebrow" style="margin-bottom:10px;">What changed this month? ✨</div>
        <div style="display:flex;flex-direction:column;gap:6px;">${whatChanged.map(s=>`<div style="font-size:13.5px;line-height:1.5;">${esc(s)}</div>`).join("")}</div>
      </div>` : ""}
      <div style="margin-top:18px;">
        <div class="pt-eyebrow" style="margin-bottom:10px;">Compared with last month</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${rows.filter(r=>r.cmp).map(r=>`<div style="font-size:13.5px;display:flex;justify-content:space-between;"><span style="color:var(--pt-text-dim);">${r.label}</span><span style="font-weight:600;">${r.cmp}</span></div>`).join("")}
          ${rows.every(r=>!r.cmp) ? `<div style="font-size:13px;color:var(--pt-text-dim);">Not enough data from last month to compare yet.</div>` : ""}
        </div>
      </div>
      <button class="pt-btn-secondary" style="width:100%;margin-top:20px;" onclick="ui.monthlySummaryOpen=false; render();">Close</button>
    </div>
  </div>`;
}
function detailRow(label, value){ return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--pt-border);font-size:14px;"><span style="color:var(--pt-text-dim);">${label}</span><span style="font-weight:500;text-align:right;max-width:60%;">${esc(String(value))}</span></div>`; }

function renderCyclePatternCard(stats){
  const recentLengths = stats.lengths.slice(-6);
  const hasRange = stats.shortest!=null && stats.longest!=null;
  const consistency = cycleConsistency(stats.variation);
  return `<div class="pt-card">
    <div class="pt-eyebrow" style="margin-bottom:12px;">My Cycle Pattern 🌷</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;margin-bottom:14px;">
      <div><div class="pt-mono" style="font-size:21px;font-weight:500;">${stats.avgCycleLength}</div><div class="pt-eyebrow" style="margin-top:2px;">Average</div></div>
      <div><div style="font-family:'Fraunces',serif;font-size:21px;font-weight:500;">${stats.avgPeriodLen}d</div><div class="pt-eyebrow" style="margin-top:2px;">Typical Period</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;">
      <div><div class="pt-mono" style="font-size:17px;font-weight:500;">${hasRange?`${stats.shortest}–${stats.longest}d`:"—"}</div><div class="pt-eyebrow" style="margin-top:2px;">Recent Range</div></div>
      <div><div class="pt-mono" style="font-size:17px;font-weight:500;">${stats.variation!=null?`${stats.variation}d`:"—"}</div><div class="pt-eyebrow" style="margin-top:2px;">Cycle Variation</div></div>
    </div>
    <div style="font-size:12px;color:var(--pt-text-dim);margin-top:16px;">${recentLengths.length>0?`Based on ${recentLengths.length} recent cycle${recentLengths.length===1?"":"s"}`:"Log a few cycles to see your pattern"}</div>
    ${consistency ? `<div style="margin-top:8px;"><span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--pt-surface-2);">${consistency.emoji} ${consistency.label.toUpperCase()}</span></div>` : ""}
    ${hasRange ? `<div style="margin-top:22px;padding:0 2px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="pt-mono" style="font-size:11.5px;color:var(--pt-text-dim);">${stats.shortest}</span>
        <div style="flex:1;height:4px;border-radius:999px;background:var(--pt-surface-2);position:relative;">
          ${recentLengths.map(len=>{ const pct = stats.longest===stats.shortest?50:((len-stats.shortest)/(stats.longest-stats.shortest))*100; return `<span title="${len} days" style="position:absolute;top:-3px;height:10px;width:10px;border-radius:999px;left:${pct}%;transform:translateX(-50%);background:linear-gradient(135deg, var(--pt-primary), var(--pt-lavender));box-shadow:0 0 0 2px var(--pt-surface);"></span>`; }).join("")}
        </div>
        <span class="pt-mono" style="font-size:11.5px;color:var(--pt-text-dim);">${stats.longest}</span>
      </div>
    </div>` : ""}
    ${recentLengths.length>0 ? `<div style="margin-top:20px;"><div class="pt-eyebrow" style="margin-bottom:8px;">Recent Cycles</div>
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        ${recentLengths.map((l,i,arr)=>`<span class="pt-mono" style="font-size:13px;padding:5px 10px;border-radius:999px;background:var(--pt-surface-2);">${l}</span>${i<arr.length-1?`<span style="color:var(--pt-text-dim);">→</span>`:""}`).join("")}
      </div></div>` : ""}
    ${hasRange ? `<div style="margin-top:16px;font-size:13.5px;line-height:1.55;">Your recent cycles range from ${stats.shortest}–${stats.longest} days.${consistency?`<br />Your cycle pattern looks ${consistency.label.toLowerCase()}.`:""}</div>` : ""}
    <button onclick="ui.explainOpen=!ui.explainOpen; render();" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--pt-lavender);font-size:12.5px;font-weight:600;padding:12px 0 0;margin-top:4px;">ⓘ What does this mean?</button>
    ${ui.explainOpen ? `<div style="font-size:12.5px;color:var(--pt-text-dim);line-height:1.6;margin-top:8px;">"Recent range" is your shortest and longest cycle out of the last ${recentLengths.length||0} you've logged. "Cycle variation" is the gap between those two. These describe the pattern in what you've tracked; they're not a health assessment.</div>` : ""}
  </div>`;
}

function renderTimeline(stats){
  if(!stats.lastCycle) return "";
  const steps = [
    {label:"Last Period", value: stats.lastCycle.endDate?`${fmtDate(stats.lastCycle.startDate)}–${fmtDate(stats.lastCycle.endDate)}`:`Started ${fmtDate(stats.lastCycle.startDate)}`, emoji:"🌸"},
    {label:"Current Cycle", value:`Day ${diffDays(stats.lastCycle.startDate, todayISO())+1}`, emoji:"●"},
    {label:"Estimated Next Period", value: stats.predictedNext?fmtDate(stats.predictedNext):"Not enough data yet", emoji:"○"},
  ];
  return `<div class="pt-card"><div class="pt-eyebrow" style="margin-bottom:14px;">From History to Estimate</div>
    <div style="display:flex;flex-direction:column;">
      ${steps.map((s,i)=>`<div style="display:flex;gap:12px;">
        <div style="display:flex;flex-direction:column;align-items:center;">
          <span style="width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;background:linear-gradient(135deg, var(--pt-primary-dim), var(--pt-lavender-dim));">${s.emoji}</span>
          ${i<steps.length-1?`<div style="width:2px;flex:1;background:var(--pt-border);min-height:22px;margin:2px 0;"></div>`:""}
        </div>
        <div style="padding-bottom:${i<steps.length-1?"18px":"0"};"><div class="pt-eyebrow">${s.label}</div><div style="font-size:14.5px;font-weight:600;margin-top:2px;">${esc(s.value)}</div></div>
      </div>`).join("")}
    </div></div>`;
}

function renderSymptomPatternCard(pattern){
  const top = pattern.slice(0,5), leader = top[0];
  return `<div class="pt-card"><div class="pt-eyebrow" style="margin-bottom:12px;">Your Common Symptoms</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${top.map(p=>`<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:15px;">${SYMPTOM_EMOJI[p.symptom]||"•"}</span><span style="font-size:14px;flex:1;">${p.symptom}</span><span class="pt-mono" style="font-size:12.5px;color:var(--pt-text-dim);">${p.cycleCount} cycle${p.cycleCount===1?"":"s"}</span></div>`).join("")}
    </div>
    ${leader ? `<div style="font-size:12.5px;color:var(--pt-text-dim);margin-top:14px;line-height:1.5;">You most often log ${leader.symptom.toLowerCase()} around your period.</div>` : ""}
  </div>`;
}

function renderCompareCard(comparison){
  const {previous, current} = comparison;
  const rows = [
    {label:"Cycle length", prev: previous.cycleLength?`${previous.cycleLength} days`:"—", curr: current.cycleLength?`${current.cycleLength} days`:"In progress"},
    {label:"Period length", prev: previous.periodLength?`${previous.periodLength} days`:"—", curr: current.periodLength?`${current.periodLength} days`:"—"},
    {label:"Cramps", prev:`${previous.crampDays} day${previous.crampDays===1?"":"s"}`, curr:`${current.crampDays} day${current.crampDays===1?"":"s"}`},
    {label:"Average pain", prev: previous.avgPain!=null?`${previous.avgPain}/10`:"—", curr: current.avgPain!=null?`${current.avgPain}/10`:"—"},
    {label:"Feeling", prev: previous.feeling||"—", curr: current.feeling||"—"},
  ];
  const cycleDelta = previous.cycleLength!=null && current.cycleLength!=null ? current.cycleLength - previous.cycleLength : null;
  return `<div class="pt-card"><div class="pt-eyebrow" style="margin-bottom:12px;">This Cycle vs Last Cycle</div>
    <div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;font-size:13px;">
      <div></div><div style="color:var(--pt-text-dim);font-weight:600;">Previous</div><div style="color:var(--pt-text-dim);font-weight:600;">Current</div>
      ${rows.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--pt-border);">${r.label}</div><div style="padding:8px 0;border-bottom:1px solid var(--pt-border);font-weight:500;">${esc(String(r.prev))}</div><div style="padding:8px 0;border-bottom:1px solid var(--pt-border);font-weight:600;">${esc(String(r.curr))}</div>`).join("")}
    </div>
    ${cycleDelta!=null && cycleDelta!==0 ? `<div style="font-size:13px;color:var(--pt-text-dim);margin-top:12px;line-height:1.5;">Your current cycle is ${Math.abs(cycleDelta)} day${Math.abs(cycleDelta)===1?"":"s"} ${cycleDelta>0?"longer":"shorter"} than your previous cycle.</div>` : ""}
  </div>`;
}

function renderPeriodStoryCard(stats, symptomPattern){
  if(stats.cycleCount<3) return "";
  const feelingCounts={};
  Object.values(state.dailyLogs).forEach(l=>{ if(l.feeling) feelingCounts[l.feeling]=(feelingCounts[l.feeling]||0)+1; });
  const topFeeling = Object.entries(feelingCounts).sort((a,b)=>b[1]-a[1])[0];
  const topFeelingLabel = topFeeling ? FEELING_LIST.find(f=>f.key===topFeeling[0])?.label : "—";
  const months = [...new Set(state.cycles.map(c=>c.startDate.slice(0,7)))].sort();
  const monthLabels = months.map(m=>new Date(`${m}-01T00:00:00`).toLocaleDateString("en-US",{month:"short"}));
  return `<div class="pt-card" style="background:var(--pt-gradient);border:1px solid rgba(255,255,255,0.5);">
    <div class="pt-eyebrow" style="margin-bottom:4px;">My Cycle Story 🌸</div>
    <div style="font-size:13px;color:var(--pt-text-dim);margin-bottom:16px;">You've tracked ${stats.cycleCount} cycles</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      ${storyStat("Average cycle", `${stats.avgCycleLength} days`)}
      ${storyStat("Average period", `${stats.avgPeriodLen} days`)}
      ${storyStat("Most common symptom", symptomPattern[0]?.symptom||"—")}
      ${storyStat("Most common feeling", topFeelingLabel)}
      ${storyStat("Longest cycle", stats.longest?`${stats.longest} days`:"—")}
      ${storyStat("Shortest cycle", stats.shortest?`${stats.shortest} days`:"—")}
    </div>
    ${monthLabels.length>1 ? `<div style="display:flex;align-items:center;gap:6px;margin-top:18px;flex-wrap:wrap;">
      ${monthLabels.map((m,i,arr)=>`<span class="pt-mono" style="font-size:11.5px;padding:4px 9px;border-radius:999px;background:var(--pt-surface);">${m}</span>${i<arr.length-1?`<span style="color:var(--pt-text-dim);font-size:12px;">→</span>`:""}`).join("")}
    </div>` : ""}
  </div>`;
}
function storyStat(label,value){ return `<div><div style="font-family:'Fraunces',serif;font-size:17px;">${esc(value)}</div><div class="pt-eyebrow" style="margin-top:2px;">${label}</div></div>`; }

function renderPeriodDiary(){
  const entries = Object.values(state.dailyLogs).filter(l=>l.note||l.feeling||(l.symptoms&&l.symptoms.length)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,20);
  if(entries.length===0) return "";
  const cycleDayFor = (date)=>{ const cyc=[...state.cycles].filter(c=>c.startDate<=date).sort((a,b)=>b.startDate.localeCompare(a.startDate))[0]; return cyc?diffDays(cyc.startDate,date)+1:null; };
  return `<div><div class="pt-eyebrow" style="margin-bottom:10px;">Period Diary</div>
    <div class="pt-card" style="padding:6px 18px;">
      ${entries.map((e,i)=>{
        const feeling = e.feeling && FEELING_LIST.find(f=>f.key===e.feeling);
        const cd = cycleDayFor(e.date);
        return `<div style="padding:14px 0;border-bottom:${i<entries.length-1?"1px solid var(--pt-border)":"none"};">
          <div style="font-weight:600;font-size:13.5px;">${fmtDate(e.date,{month:"short",day:"numeric"})}${cd?` — Day ${cd}`:""}</div>
          <div style="font-size:13px;color:var(--pt-text-dim);margin-top:3px;">${feeling?feeling.emoji+" ":""}${[feeling?.label, e.symptoms?.length?e.symptoms.join(", "):null].filter(Boolean).join(" · ")}</div>
          ${e.note?`<div style="font-size:13.5px;margin-top:4px;font-style:italic;">"${esc(e.note)}"</div>`:""}
        </div>`;
      }).join("")}
    </div></div>`;
}

/* ============================================================
   CYCLE HISTORY (edit/delete)
   ============================================================ */
function historyToggleOpen(id){ ui.historyOpenId = ui.historyOpenId===id?null:id; ui.historyEditingId=null; ui.historyDeletingId=null; ui.historyDateError=null; render(); }
function historyStartEdit(id){ ui.historyEditingId=id; ui.historyDeletingId=null; ui.historyDateError=null; render(); }
function historyCancelEdit(){ ui.historyEditingId=null; ui.historyDateError=null; render(); }
function historySaveEdit(id){
  const startEl = document.getElementById(`edit-start-${id}`), endEl = document.getElementById(`edit-end-${id}`);
  const start = startEl.value, end = endEl.value;
  const err = validatePeriodStart(state.cycles, start, id) || (end ? validatePeriodEnd(state.cycles, start, end, id) : null);
  if(err){ ui.historyDateError=err; render(); return; }
  editCycle(id, {startDate:start, endDate: end||null});
  ui.historyEditingId=null; ui.historyDateError=null; render();
}
function historyAskDelete(id){ ui.historyDeletingId=id; ui.historyEditingId=null; render(); }
function historyCancelDelete(){ ui.historyDeletingId=null; render(); }
function historyConfirmDelete(id){ deleteCycle(id); ui.historyDeletingId=null; ui.historyOpenId=null; render(); }

function renderCycleHistory(){
  const sorted = [...state.cycles].sort((a,b)=>b.startDate.localeCompare(a.startDate));
  if(sorted.length===0){
    return `<div class="pt-card" style="text-align:center;padding:36px 22px;"><div style="font-size:34px;margin-bottom:10px;">🗓️</div><h3 style="font-size:17px;margin-bottom:6px;">No history yet</h3><div style="font-size:13.5px;color:var(--pt-text-dim);">Log a period to start building your cycle history.</div></div>`;
  }
  const withLength = sorted.map((c,i)=>{ const prevChron = sorted[i-1]; const length = prevChron ? diffDays(c.startDate, prevChron.startDate) : null; return {...c, cycleLength:length}; });
  return `<div style="display:flex;flex-direction:column;gap:10px;">
    ${withLength.map(c=>{
      const duration = c.endDate ? diffDays(c.startDate,c.endDate)+1 : null;
      const open = ui.historyOpenId===c.id, isEditing = ui.historyEditingId===c.id, isDeleting = ui.historyDeletingId===c.id;
      return `<div class="pt-card" style="padding:14px;">
        <button onclick="historyToggleOpen('${c.id}')" style="width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:none;color:var(--pt-text);padding:0;text-align:left;">
          <div><div style="font-weight:600;font-size:15px;">${fmtDate(c.startDate)} ${c.endDate?`– ${fmtDate(c.endDate)}`:"(ongoing)"}</div>
          <div style="font-size:12.5px;color:var(--pt-text-dim);margin-top:2px;">${c.cycleLength?`Cycle: ${c.cycleLength} days · `:""}${duration?`Duration: ${duration} days`:"Duration not set"}</div></div>
          <span style="transform:${open?"rotate(180deg)":"none"};">⌄</span>
        </button>
        ${open && !isEditing && !isDeleting ? `<div style="margin-top:12px;display:flex;gap:8px;">
          <button class="pt-btn-secondary" style="flex:1;" onclick="historyStartEdit('${c.id}')">Edit</button>
          <button class="pt-btn-secondary" style="flex:1;color:var(--pt-danger);border-color:var(--pt-danger);" onclick="historyAskDelete('${c.id}')">Delete</button>
        </div>` : ""}
        ${open && isEditing ? `<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div><label for="edit-start-${c.id}">Start date</label><input id="edit-start-${c.id}" type="date" value="${c.startDate}" max="${todayISO()}" /></div>
            <div><label for="edit-end-${c.id}">End date</label><input id="edit-end-${c.id}" type="date" value="${c.endDate||""}" max="${todayISO()}" /></div>
          </div>
          ${ui.historyDateError?`<div style="font-size:12.5px;color:var(--pt-danger);">${esc(ui.historyDateError)}</div>`:""}
          <div style="display:flex;gap:8px;"><button class="pt-btn-secondary" style="flex:1;" onclick="historyCancelEdit()">Cancel</button><button class="pt-btn-primary" style="flex:1;" onclick="historySaveEdit('${c.id}')">Save changes</button></div>
        </div>` : ""}
        ${open && isDeleting ? `<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px;">
          <div style="font-size:13.5px;color:var(--pt-text-dim);line-height:1.5;">Delete this cycle entry?</div>
          <div style="display:flex;gap:8px;"><button class="pt-btn-secondary" style="flex:1;" onclick="historyCancelDelete()">Cancel</button><button class="pt-btn-primary" style="flex:1;background:var(--pt-danger);box-shadow:none;" onclick="historyConfirmDelete('${c.id}')">Yes, delete</button></div>
        </div>` : ""}
      </div>`;
    }).join("")}
  </div>`;
}

/* ============================================================
   SETTINGS
   ============================================================ */
function setTheme(t){ setSettings({theme:t}); }
function togglePrivateMode(){ setSettings({privateMode: !state.settings.privateMode}); }
function updateReminder(key, patch){ setSettings({reminders:{...state.settings.reminders, [key]:{...state.settings.reminders[key], ...patch}}}); }
function askDeleteAll(){ ui.confirmDeleteAll=true; render(); }
function cancelDeleteAll(){ ui.confirmDeleteAll=false; render(); }

function renderSettings(){
  const s = state.settings;
  return `<div style="display:flex;flex-direction:column;gap:16px;">
    <div class="pt-card">
      <h3 style="font-size:15px;margin-bottom:12px;">Appearance</h3>
      <div class="pt-row">${["light","dark","system"].map(t=>`<button class="pt-chip" aria-pressed="${s.theme===t}" onclick="setTheme('${t}')" style="text-transform:capitalize;flex:1;">${t}</button>`).join("")}</div>
    </div>

    <div class="pt-card">
      <div class="pt-flex-between">
        <div><h3 style="font-size:15px;">Private Mode</h3><div style="font-size:12.5px;color:var(--pt-text-dim);margin-top:2px;max-width:320px;">Hides cycle details on the dashboard and keeps notification text generic.</div></div>
        ${switchHTML(s.privateMode, "togglePrivateMode()")}
      </div>
    </div>

    <div class="pt-card">
      <h3 style="font-size:15px;margin-bottom:14px;">Reminders</h3>
      ${reminderRow("upcoming","Upcoming period","Sent before your expected period", s.reminders.upcoming, true)}
      ${reminderRow("expectedToday","Expected today","Sent on your predicted period date", s.reminders.expectedToday, false)}
      ${reminderRow("delayed","Delayed period","Sent if your period hasn't been logged after the predicted date", s.reminders.delayed, false)}
      ${reminderRow("dailyLog","Daily log","A gentle daily nudge to log symptoms", s.reminders.dailyLog, false, true)}
      <div style="font-size:11.5px;color:var(--pt-text-dim);margin-top:10px;line-height:1.5;">Reminder preferences are saved with your data. This static build shows in-app notifications only (no push/SMS backend).</div>
    </div>

    <div class="pt-card">
      <h3 style="font-size:15px;margin-bottom:12px;">Export My Data</h3>
      <div class="pt-row">
        <button class="pt-btn-secondary" onclick="exportJSON()">Export JSON</button>
        <button class="pt-btn-secondary" onclick="exportCSV()">Export CSV</button>
        <button class="pt-btn-secondary" onclick="exportPDFSummary()">Export summary</button>
      </div>
    </div>

    <div class="pt-card" style="border-color:var(--pt-danger);">
      <h3 style="font-size:15px;margin-bottom:8px;color:var(--pt-danger);">Delete Data</h3>
      ${!ui.confirmDeleteAll ? `<button class="pt-btn-secondary" style="color:var(--pt-danger);border-color:var(--pt-danger);" onclick="askDeleteAll()">Delete all cycle data</button>`
        : `<div><div style="font-size:14px;margin-bottom:12px;">Delete all cycle data? Your data will be permanently removed.</div>
          <div class="pt-row"><button class="pt-btn-secondary" onclick="cancelDeleteAll()">Cancel</button><button class="pt-btn-primary" style="background:var(--pt-danger);" onclick="deleteAllData()">Yes, delete everything</button></div></div>`}
    </div>

    <div class="pt-card" style="background:var(--pt-surface-2);">
      <div style="font-size:12.5px;color:var(--pt-text-dim);line-height:1.6;">This app is intended for personal cycle tracking and informational purposes only. Estimates are not a medical diagnosis or a substitute for professional medical advice. Your data is stored locally in this browser only.</div>
    </div>
  </div>`;
}
function switchHTML(checked, onclick){ return `<button class="pt-switch" role="switch" aria-checked="${checked}" onclick="${onclick}"><span class="knob"></span></button>`; }
function reminderRow(key,title,desc,cfg,showDaysBefore,last){
  return `<div style="padding:12px 0;border-bottom:${last?"none":"1px solid var(--pt-border)"};">
    <div class="pt-flex-between" style="align-items:flex-start;gap:12px;">
      <div><div style="font-weight:600;font-size:14px;">${title}</div><div style="font-size:12.5px;color:var(--pt-text-dim);margin-top:2px;">${desc}</div></div>
      ${switchHTML(cfg.enabled, `updateReminder('${key}', {enabled: ${!cfg.enabled}})`)}
    </div>
    ${cfg.enabled ? `<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
      <div style="flex:1 1 100px;"><label style="font-size:11px;">Time</label><input type="text" value="${esc(cfg.time)}" onchange="updateReminder('${key}', {time:this.value})" placeholder="09:00" /></div>
      ${showDaysBefore ? `<div style="flex:1 1 100px;"><label style="font-size:11px;">Days before</label><input type="number" min="1" max="10" value="${cfg.daysBefore}" onchange="updateReminder('${key}', {daysBefore:Number(this.value)})" /></div>` : ""}
    </div>` : ""}
  </div>`;
}

/* ============================================================
   NOTIFICATION CENTER
   ============================================================ */
function renderNotifCenter(){
  return `<div class="pt-sheet-backdrop" onclick="toggleNotif()">
    <div class="pt-sheet" onclick="event.stopPropagation()">
      <div class="pt-grabber"></div>
      <div class="pt-flex-between" style="margin-bottom:14px;">
        <h2 style="font-size:18px;">Notifications</h2>
        ${state.notifications.length>0?`<button class="pt-btn-secondary" style="padding:6px 14px;font-size:13px;" onclick="clearAllNotifs()">Clear all</button>`:""}
      </div>
      ${state.notifications.length===0 ? `<div style="color:var(--pt-text-dim);font-size:14px;padding:20px 0;text-align:center;">You're all caught up.</div>`
      : `<div style="display:flex;flex-direction:column;gap:8px;">
        ${state.notifications.map(n=>`<button onclick="markNotifRead('${n.id}');openNotifDate(${n.relatedDate?`'${n.relatedDate}'`:null})" style="text-align:left;padding:12px;border-radius:12px;border:1px solid var(--pt-border);background:${n.read?"transparent":"var(--pt-primary-dim)"};font-size:13.5px;color:var(--pt-text);display:flex;gap:8px;align-items:flex-start;width:100%;">
          <span>🔔</span><span style="flex:1;"><div>${state.settings.privateMode?"Your reminder is ready.":esc(n.text)}</div><div style="font-size:11px;color:var(--pt-text-dim);margin-top:3px;">${new Date(n.ts).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</div></span>
        </button>`).join("")}
      </div>`}
    </div>
  </div>`;
}

/* ============================================================
   QUICK ACTION (FAB) SHEET
   ============================================================ */
function renderFabSheet(){
  const actions = [
    {key:"period_today", label:"Period started today", icon:"🩸"},
    {key:"symptoms", label:"Log Symptoms", icon:"🩹"},
    {key:"mood", label:"Log Mood", icon:"🙂"},
    {key:"note", label:"Add Note", icon:"📝"},
    {key:"reminder", label:"Add Reminder", icon:"🔔"},
  ];
  return `<div class="pt-sheet-backdrop" onclick="toggleFab()">
    <div class="pt-sheet" onclick="event.stopPropagation()">
      <div class="pt-grabber"></div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        ${actions.map(a=>`<button class="pt-card-press" onclick="fabPick('${a.key}')" style="display:flex;align-items:center;gap:13px;padding:14px 10px;background:none;border:none;font-size:15.5px;font-weight:500;color:var(--pt-text);border-radius:14px;text-align:left;width:100%;">
          <span style="font-size:18px;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, var(--pt-primary-dim), var(--pt-lavender-dim));">${a.icon}</span> ${a.label}
        </button>`).join("")}
      </div>
    </div>
  </div>`;
}
function fabPick(action){
  ui.fabOpen=false;
  if(action==="reminder"){ setView("settings"); showToast("Manage reminders below"); return; }
  if(action==="period_today"){ quickLogPeriodToday(); return; }
  openLogScreen(todayISO(), action);
}

/* ============================================================
   ONBOARDING
   ============================================================ */
function obGoto(step){ ui.onboardStep = step; render(); }
function obSetLastPeriod(v){ ui.ob.lastPeriodStart = v; }
function obSetCycleKnown(v){ ui.ob.cycleKnown = v; render(); }
function obSetDurationKnown(v){ ui.ob.durationKnown = v; render(); }
function obSetCycleLength(v){ ui.ob.typicalCycleLength = Number(v); }
function obSetPeriodLength(v){ ui.ob.typicalPeriodLength = Number(v); }
function obToggleReminder(key){ ui.ob.reminders[key].enabled = !ui.ob.reminders[key].enabled; render(); }
function obFinish(){
  const dateEl = document.getElementById("ob-date");
  const lastPeriodStart = dateEl ? dateEl.value : ui.ob.lastPeriodStart;
  if(lastPeriodStart){
    state.cycles = [{id:uid(), startDate:lastPeriodStart, endDate:null, createdAt:Date.now(), updatedAt:Date.now()}];
  }
  state.settings = {
    ...state.settings, onboarded:true,
    typicalCycleLength: ui.ob.cycleKnown==="know" ? ui.ob.typicalCycleLength : null,
    typicalPeriodLength: ui.ob.durationKnown==="know" ? ui.ob.typicalPeriodLength : null,
    reminders: ui.ob.reminders,
  };
  persist();
  render();
}

function renderOnboarding(){
  const step = ui.onboardStep;
  let body = "";
  if(step===0){
    body = `<h1 style="font-size:28px;line-height:1.2;margin-bottom:12px;">Understand Your Cycle</h1>
      <p style="font-size:15.5px;color:var(--pt-text-dim);line-height:1.6;">Track periods, symptoms, moods, and cycle patterns in one private place.</p>`;
  } else if(step===1){
    body = `<h1 style="font-size:24px;margin-bottom:12px;">Start With Your Last Period</h1>
      <p style="font-size:14px;color:var(--pt-text-dim);margin-bottom:18px;">When did your last period start?</p>
      <label for="ob-date">Start date</label>
      <input id="ob-date" type="date" max="${todayISO()}" value="${esc(ui.ob.lastPeriodStart)}" oninput="obSetLastPeriod(this.value)" />`;
  } else if(step===2){
    body = `<h1 style="font-size:24px;margin-bottom:16px;">Tell Us About Your Cycle</h1>
      <div style="margin-bottom:20px;">
        <label>Typical cycle length</label>
        <div class="pt-row" style="margin-bottom:${ui.ob.cycleKnown==="know"?"10px":"0"};">
          <button class="pt-chip" aria-pressed="${ui.ob.cycleKnown==="know"}" onclick="obSetCycleKnown('know')">I know</button>
          <button class="pt-chip" aria-pressed="${ui.ob.cycleKnown==="unknown"}" onclick="obSetCycleKnown('unknown')">I don't know</button>
        </div>
        ${ui.ob.cycleKnown==="know" ? `<input type="number" min="15" max="60" value="${ui.ob.typicalCycleLength}" oninput="obSetCycleLength(this.value)" />` : ""}
      </div>
      <div>
        <label>Period duration</label>
        <div class="pt-row" style="margin-bottom:${ui.ob.durationKnown==="know"?"10px":"0"};">
          <button class="pt-chip" aria-pressed="${ui.ob.durationKnown==="know"}" onclick="obSetDurationKnown('know')">I know</button>
          <button class="pt-chip" aria-pressed="${ui.ob.durationKnown==="unknown"}" onclick="obSetDurationKnown('unknown')">I don't know</button>
        </div>
        ${ui.ob.durationKnown==="know" ? `<input type="number" min="1" max="14" value="${ui.ob.typicalPeriodLength}" oninput="obSetPeriodLength(this.value)" />` : ""}
      </div>`;
  } else if(step===3){
    body = `<h1 style="font-size:24px;margin-bottom:16px;">Choose Reminders</h1>
      <div style="display:flex;flex-direction:column;gap:4px;">
        ${["upcoming","dailyLog","delayed"].map(k=>{
          const labels={upcoming:"Upcoming period", dailyLog:"Daily logging", delayed:"Delay notification"};
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--pt-border);">
            <span style="font-size:14.5px;">${labels[k]}</span>${switchHTML(ui.ob.reminders[k].enabled, `obToggleReminder('${k}')`)}
          </div>`;
        }).join("")}
      </div>`;
  }

  return `<div style="min-height:100vh;background:var(--pt-bg);color:var(--pt-text);font-family:'Inter',sans-serif;">
    <div style="min-height:100vh;display:flex;flex-direction:column;padding:28px 22px;max-width:480px;margin:0 auto;">
      <div style="display:flex;gap:6px;margin-bottom:32px;">
        ${[0,1,2,3].map(i=>`<div style="flex:1;height:3px;border-radius:999px;background:${i<=step?"var(--pt-primary)":"var(--pt-surface-2)"};"></div>`).join("")}
      </div>
      <div style="flex:1;">${body}</div>
      <div style="display:flex;gap:10px;margin-top:24px;">
        ${step>0 ? `<button class="pt-btn-secondary" onclick="obGoto(${step-1})">Back</button>` : ""}
        ${step<3 ? `<button class="pt-btn-primary" style="flex:1;" onclick="onboardingNext(${step})">Continue</button>` : `<button class="pt-btn-primary" style="flex:1;" onclick="obFinish()">Get Started</button>`}
      </div>
      ${step>0 && step<3 ? `<button onclick="onboardingNext(${step})" style="background:none;border:none;color:var(--pt-text-dim);font-size:13px;margin-top:12px;text-align:center;">Skip for now</button>` : ""}
      ${step===3 ? `<button onclick="obFinish()" style="background:none;border:none;color:var(--pt-text-dim);font-size:13px;margin-top:12px;text-align:center;">Skip for now</button>` : ""}
    </div>
  </div>`;
}
function onboardingNext(step){
  if(step===1){ const el=document.getElementById("ob-date"); if(el) ui.ob.lastPeriodStart = el.value; }
  ui.onboardStep = step+1; render();
}

/* ============================================================
   INIT
   ============================================================ */
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>{ if(state.settings.theme==="system") render(); });
}
render();
</script>
</body>
</html>
